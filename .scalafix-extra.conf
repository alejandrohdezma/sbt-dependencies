# Relaxations over the sbt-scalafix-defaults configuration, required by the
# intellij-plugin project: the IntelliJ lexer API (LexerBase) is an imperative,
# null-terminated contract and lexing is a hot path.

DisableSyntax {
  noNulls = false
  noUniversalEquality = false
  noVars = false
  noWhileLoops = false
}
