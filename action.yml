name: sbt-dependencies
description: Update every dependency in project/dependencies.conf, run matching post-update hooks, and upsert an update pull request.

branding:
  icon: arrow-up-circle
  color: red

inputs:
  config-file:
    description: |
      Path (relative to the workspace) to a Scala Steward-style HOCON file
      applied to every constraint class: `postUpdateHooks`, `migrations`
      (scalafix), `changes` (artifact migrations), `updates.ignore`,
      `updates.pin`, `updates.retracted` and `updates.cooldown`.

      Sections the plugin doesn't know are ignored, so an existing
      `.scala-steward.conf` can be reused as-is. The action fails when the
      file doesn't exist.
    required: false
    default: ""
  extra-command:
    description: |
      Optional sbt command(s) to run in their own step (and commit) after the
      dependency update (e.g. `changesetFromDependencyDiff`, or
      `useBomManagedVersions --safe` to adopt BOM-managed versions
      automatically — its report is appended to the pull request). Use `;`
      to chain multiple commands.
    required: false
    default: ""
  create-pr:
    description: |
      Whether to commit the changes (one commit per stage: the update, the
      extra command, and each post-update hook, mirroring Scala Steward) and
      create/update the pull request. When `false` the working tree is left
      dirty for the caller to handle.
    required: false
    default: "true"
  branch:
    description: "Branch to push the updates to when creating the pull request"
    required: false
    default: updates/dependencies
  base:
    description: |
      Base branch for the created pull request. When empty, the default
      branch of the repository in the workspace is detected from `origin`
      (the event's repository can't be trusted for this: an org-wide
      workflow runs from another repository entirely).
    required: false
    default: ""
  pr-title:
    description: "Title for the created/updated pull request. Also used as the update commit's message."
    required: false
    default: Update dependencies
  pr-body:
    description: "Body for the created/updated pull request. The failure report (when an sbt step fails) and the post-update hooks report are appended to it."
    required: false
    default: "Automated dependency updates from [`sbt-dependencies`](https://github.com/alejandrohdezma/sbt-dependencies)."
  github-token:
    description: "GitHub token used to create/update the pull request (defaults to github.token)"
    required: false
    default: ${{ github.token }}

outputs:
  bom-report:
    description: "Markdown report of the BOM-managed versions adopted (and, in safe mode, left as is) by `useBomManagedVersions`. Empty when the task didn't run or had nothing to report."
    value: ${{ steps.bom.outputs.report }}
  hooks-report:
    description: "Markdown report of executed and failed post-update hooks. Empty when no hooks matched the update."
    value: ${{ steps.hooks.outputs.report }}
  pr-number:
    description: "Number of the created/updated pull request (empty when no PR was created)"
    value: ${{ steps.upsert-pr.outputs.pr-number }}
  pr-url:
    description: "URL of the created/updated pull request (empty when no PR was created)"
    value: ${{ steps.upsert-pr.outputs.pr-url }}

runs:
  using: composite
  steps:
    - name: Validate config file
      if: inputs.config-file != ''
      shell: bash
      env:
        CONFIG_FILE: ${{ inputs.config-file }}
      run: |
        if [ ! -f "$CONFIG_FILE" ]; then
          echo "::error::Provided config file ($CONFIG_FILE) does not exist"
          exit 1
        fi

    - name: Prepare branch
      if: inputs.create-pr == 'true'
      id: branch
      shell: bash
      env:
        BRANCH: ${{ inputs.branch }}
        BASE: ${{ inputs.base }}
      run: |
        git config --global user.name "github-actions"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

        if [ -z "$BASE" ]; then
          BASE=$(git ls-remote --symref origin HEAD | awk '/^ref:/ {sub("refs/heads/", "", $2); print $2}')
          echo "🔎 Detected default branch: $BASE"
        fi

        git checkout -B "$BRANCH"

        echo "base=$BASE" >> "$GITHUB_OUTPUT"
        echo "start-sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

    # When a config file is provided it is appended to every constraint-class
    # setting, so a single Scala Steward-style file drives hooks, migrations,
    # ignores, pins, retractions and cooldown.
    #
    # A failing sbt invocation (here and in the following steps) never stops
    # the flow: whatever the update managed to change is still committed and
    # ends up in the pull request, together with a warning explaining how to
    # finish the update manually. The job itself still fails at the end.
    - name: Update dependencies
      id: update
      shell: bash
      env:
        CONFIG_FILE: ${{ inputs.config-file }}
      run: |
        args=()
        if [ -n "$CONFIG_FILE" ]; then
          for setting in dependencyPostUpdateHooks dependencyScalafixMigrations dependencyMigrations \
            dependencyUpdateIgnores dependencyUpdatePins dependencyUpdateRetractions dependencyCooldowns; do
            args+=("set ThisBuild / $setting += file(\"$CONFIG_FILE\").toURI")
          done
        fi
        if ! sbt "${args[@]}" updateAllDependencies; then
          echo "::warning::updateAllDependencies failed — the changes made so far will still be committed"
          echo "failed=true" >> "$GITHUB_OUTPUT"
        fi

    - name: Format dependencies file
      id: format
      shell: bash
      env:
        CREATE_PR: ${{ inputs.create-pr }}
        COMMIT_MESSAGE: ${{ inputs.pr-title }}
      run: |
        if ! sbt formatDependenciesFile; then
          echo "::warning::formatDependenciesFile failed — the update changes will still be committed"
          echo "failed=true" >> "$GITHUB_OUTPUT"
        fi
        if [ "$CREATE_PR" = "true" ] && [ -n "$(git status --porcelain)" ]; then
          git add -A
          git commit -m "$COMMIT_MESSAGE"
        fi

    - name: Run extra command
      id: extra
      if: inputs.extra-command != ''
      shell: bash
      env:
        EXTRA_COMMAND: ${{ inputs.extra-command }}
        CREATE_PR: ${{ inputs.create-pr }}
      run: |
        if ! sbt "$EXTRA_COMMAND"; then
          echo "::warning::\`$EXTRA_COMMAND\` failed — its changes (if any) will still be committed"
          echo "failed=true" >> "$GITHUB_OUTPUT"
        fi
        if [ "$CREATE_PR" = "true" ] && [ -n "$(git status --porcelain)" ]; then
          git add -A
          git commit -m "Run \`$EXTRA_COMMAND\`"
        fi

    # `useBomManagedVersions` (typically run through `extra-command`) writes one markdown file per project group under
    # target/sbt-dependencies/bom-managed; concatenating and sorting them gives a deterministic report regardless of
    # sbt's aggregation order.
    - name: Report BOM-managed versions
      id: bom
      shell: bash
      run: |
        dir=target/sbt-dependencies/bom-managed
        report=""
        if [ -d "$dir" ] && [ -n "$(ls -A "$dir")" ]; then
          report="## :link: BOM-managed versions

        \`useBomManagedVersions\` ran as part of this update. A dependency whose version a visible BOM pins is *adopted*: its line switches to \`*\`, so the version comes from the BOM from now on (and follows the BOM on every bump) — the effective version after the change is shown next to each line. In safe mode, lines with an explicit version marker (\`=\`, \`^\`, \`~\`) or a \`{{variable}}\` version are *left as is* and only listed here: they look like deliberate choices, so a human should decide whether to drop the marker or variable and adopt the BOM's version.

        $(cat "$dir"/*.md | sort)
        "
          printf '%s' "$report" >> "$GITHUB_STEP_SUMMARY"
        fi
        {
          echo "report<<BOM_EOF"
          printf '%s' "$report"
          echo "BOM_EOF"
        } >> "$GITHUB_OUTPUT"

    # Runs the scripts matched against the dependency diff (e.g. scalafix
    # migrations) best-effort: a failing hook becomes a warning and a line in
    # the report, never a failed step. Each hook that changed something gets
    # its own commit, using the hook's message.
    - name: Run post-update hooks
      id: hooks
      shell: bash
      env:
        CREATE_PR: ${{ inputs.create-pr }}
      run: |
        file=target/sbt-dependencies/.sbt-post-update-hooks
        ran=""
        failed=""
        if [ -f "$file" ]; then
          while IFS= read -r hook; do
            script=$(jq -r '.script' <<<"$hook")
            message=$(jq -r '.message' <<<"$hook")
            echo "::group::$message"
            if bash -c "$script"; then
              ran="$ran- $message"$'\n'
            else
              echo "::warning::Post-update hook failed: $script"
              failed="$failed- $message (\`$script\`)"$'\n'
            fi
            if [ "$CREATE_PR" = "true" ] && [ -n "$(git status --porcelain)" ]; then
              git add -A
              git commit -m "$message"
            fi
            echo "::endgroup::"
          done < <(jq -c '.[]' "$file")
        fi
        report=""
        if [ -n "$ran" ]; then
          report+=$'## :hammer_and_wrench: Post-update hooks executed\n\n'"$ran"
        fi
        if [ -n "$failed" ]; then
          [ -n "$report" ] && report+=$'\n'
          report+=$'## :warning: Post-update hooks that failed\n\n'"$failed"
        fi
        if [ -n "$report" ]; then
          printf '%s' "$report" >> "$GITHUB_STEP_SUMMARY"
        fi
        {
          echo "report<<REPORT_EOF"
          printf '%s' "$report"
          echo "REPORT_EOF"
        } >> "$GITHUB_OUTPUT"

    # The plugin writes target/sbt-dependencies/.sbt-update-report when a step
    # of updateAllDependencies fails: a warning block with instructions to
    # finish the update manually. Reuse it for the PR body, falling back to a
    # generic warning when sbt died before it could be written.
    - name: Build failure report
      if: steps.update.outputs.failed == 'true' || steps.format.outputs.failed == 'true' || steps.extra.outputs.failed == 'true'
      id: failure
      shell: bash
      run: |
        file=target/sbt-dependencies/.sbt-update-report
        if [ -f "$file" ]; then
          report=$(cat "$file")
        else
          report="> [!WARNING]
        > An sbt step failed while updating dependencies, so this update may be incomplete.
        >
        > To fix this:
        > 1. Clone this branch locally.
        > 2. Fix the build so it compiles.
        > 3. Run \`sbt updateAllDependencies\` to complete the remaining updates.
        > 4. Push the changes to this branch."
        fi
        report+=$'\n>\n'"> Workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
        printf '%s' "$report" >> "$GITHUB_STEP_SUMMARY"
        {
          echo "report<<FAILURE_EOF"
          printf '%s\n' "$report"
          echo "FAILURE_EOF"
        } >> "$GITHUB_OUTPUT"

    - name: Check for changes
      if: inputs.create-pr == 'true'
      id: changes
      shell: bash
      env:
        START_SHA: ${{ steps.branch.outputs.start-sha }}
      run: |
        if [ "$(git rev-parse HEAD)" = "$START_SHA" ]; then
          echo "🧺 No dependency updates."
          echo "changed=false" >> "$GITHUB_OUTPUT"
        else
          echo "changed=true" >> "$GITHUB_OUTPUT"
        fi

    - name: Create or update PR
      if: inputs.create-pr == 'true' && steps.changes.outputs.changed == 'true'
      id: upsert-pr
      uses: alejandrohdezma/actions/upsert-pr@v1
      with:
        branch: ${{ inputs.branch }}
        base: ${{ steps.branch.outputs.base }}
        title: ${{ inputs.pr-title }}
        body: |
          ${{ inputs.pr-body }}

          ${{ steps.failure.outputs.report }}

          ${{ steps.bom.outputs.report }}

          ${{ steps.hooks.outputs.report }}
        github-token: ${{ inputs.github-token }}

    # The failure report is built before the PR exists, so the PR link gets its own summary section — the summary
    # is what people open first when a run goes red, and it should say the update still landed and where.
    - name: Report pull request
      if: inputs.create-pr == 'true' && steps.upsert-pr.outputs.pr-url != ''
      shell: bash
      env:
        PR_URL: ${{ steps.upsert-pr.outputs.pr-url }}
        FAILED: ${{ steps.update.outputs.failed == 'true' || steps.format.outputs.failed == 'true' || steps.extra.outputs.failed == 'true' }}
      run: |
        if [ "$FAILED" = "true" ]; then
          printf '\n## :rocket: Pull request\n\nThe pull request was still created/updated with the partial changes: %s\n' "$PR_URL" >> "$GITHUB_STEP_SUMMARY"
        else
          printf '\n## :rocket: Pull request\n\n%s\n' "$PR_URL" >> "$GITHUB_STEP_SUMMARY"
        fi

    - name: Fail if any sbt step failed
      if: steps.update.outputs.failed == 'true' || steps.format.outputs.failed == 'true' || steps.extra.outputs.failed == 'true'
      shell: bash
      env:
        PR_URL: ${{ steps.upsert-pr.outputs.pr-url }}
      run: |
        if [ -n "$PR_URL" ]; then
          echo "::error::An sbt step failed while updating dependencies — see the warnings above. The partial changes were still committed and the pull request was created/updated: $PR_URL"
        else
          echo "::error::An sbt step failed while updating dependencies — see the warnings above. No changes were produced, so no pull request was created."
        fi
        exit 1
